services:
  postgres:
    image: postgres:17
    container_name: app-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Aponta para um volume de armazenamento de maior capacidade (ex: RAID montado no host)
      - /mnt/data/db-data:/var/lib/postgresql/data
    shm_size: "1g"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    build: .
    container_name: app
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgres://appuser:${POSTGRES_PASSWORD}@postgres:5432/appdb
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  proxy:
    image: caddy:2-alpine
    container_name: app-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
